<div *ngIf="mode === 'form'">
  <div class="login-page">
    <div class="login-card">

      <h1> 🤖 دستیار هوش مصنوعی </h1>

      <p class="subtitle">
        لطفاً وارد حساب کاربری شوید
      </p>

      <!-- جعبه خطای کلی -->
      <div class="error-box" *ngIf="error">
        {{ error }}
      </div>

      <form (ngSubmit)="loginForm.form.valid && login()" #loginForm="ngForm" novalidate>
        
        <!-- فیلد نام کاربری -->
        <div class="form-group">
          <label for="userName">نام کاربری</label>
          <input
            id="userName"
            name="userName"
            [(ngModel)]="userName"
            type="text"
            autocomplete="username"
            required
            #userNameModel="ngModel"
            [class.invalid-field]="userNameModel.invalid && (userNameModel.dirty || userNameModel.touched)"
          />
          <div class="field-error" *ngIf="userNameModel.invalid && (userNameModel.dirty || userNameModel.touched)">
            نام کاربری الزامی است.
          </div>
        </div>

        <!-- فیلد رمز عبور -->
        <div class="form-group">
          <label for="password">رمز عبور</label>
          <input
            id="password"
            name="password"
            [(ngModel)]="password"
            type="password"
            autocomplete="current-password"
            required
            #passwordModel="ngModel"
            [class.invalid-field]="passwordModel.invalid && (passwordModel.dirty || passwordModel.touched)"
          />
          <div class="field-error" *ngIf="passwordModel.invalid && (passwordModel.dirty || passwordModel.touched)">
            رمز عبور الزامی است.
          </div>
        </div>

        <!-- دکمه ورود همراه با Spinner لودینگ -->
        <button 
          class="login-btn" 
          type="submit" 
          [disabled]="loginForm.invalid || isSubmitting"
        >
          <span class="btn-spinner" *ngIf="isSubmitting"></span>
          <span>{{ isSubmitting ? 'در حال ورود...' : 'ورود' }}</span>
        </button>

      </form>
    </div>
  </div>
</div>

<div *ngIf="mode === 'windows'" class="windows-loading">
  <div class="spinner-container">
    <div class="spinner"></div>
    <p>در حال ورود خودکار سیستم...</p>
  </div>
</div>
