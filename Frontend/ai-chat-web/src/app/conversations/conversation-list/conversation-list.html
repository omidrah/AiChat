<div class="sidebar-container">

  <div class="sidebar-header">

    <div class="logo">

      <span *ngIf="!collapsed">
        🤖 AI Chat
      </span>

      <span *ngIf="collapsed">
        🤖
      </span>

    </div>

    <button class="new-chat-btn" (click)="create()">
      <span *ngIf="collapsed">＋</span>
      <span *ngIf="!collapsed"> + گفتگوی جدید </span>
    </button>

  </div>


  <div class="conversation-list">

    <div class="conversation-item" 
      [class.active]="c.id === selectedId"
      [class.editing]="editingId===c.id" 
      *ngFor="let c of conversations();trackBy:trackConversation"    (click)="open(c.id)">
      
      <span class="icon">💬</span>
      
      <input
          *ngIf="editingId === c.id"
          class="rename-input"
          [(ngModel)]="editingTitle"
          (click)="$event.stopPropagation()"
          (keydown.enter)="saveRename(c)"
          (keydown.escape)="cancelRename()">

      <span *ngIf="editingId !== c.id && !collapsed" class="title">
          {{ c.title }}
      </span>
      
      <div class="actions">

        <ng-container *ngIf="editingId===c.id">
    
            <button class="ok-btn" (click)="$event.stopPropagation();saveRename(c);">    
                ✔    
            </button>
    
            <button class="cancel-btn" (click)="cancelRename();$event.stopPropagation()">    
                ✖    
            </button>
    
        </ng-container>
    
        <ng-container *ngIf="editingId!==c.id">
    
            <button  (click)="rename(c,$event)">    
                ✏️    
            </button>
    
            <button (click)="showDelete(c);$event.stopPropagation()">    
                🗑️    
            </button>
    
        </ng-container>
    
    </div>
      <div class="delete-popup" *ngIf="confirmDeleteId===c.id" (click)="$event.stopPropagation()">
          <div>حذف گفتگو؟</div>

          <div class="popup-buttons">
              <button   class="cancel"   (click)="confirmDeleteId=''; $event.stopPropagation()">
                  لغو
              </button>
              <button   class="delete"  (click)="delete(c); $event.stopPropagation()">
                  حذف
              </button>
          </div>

      </div>
    </div>

  </div>


  <div class="sidebar-footer">
    <span *ngIf="collapsed">👤</span>

    <span *ngIf="!collapsed">👤 {{userName}} </span>

    <button class="logout-btn" (click)="logout()">
      خروج
    </button>
  </div>

</div>
