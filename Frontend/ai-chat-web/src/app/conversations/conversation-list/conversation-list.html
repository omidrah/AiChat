<div class="sidebar-container">

  <div class="sidebar-header">

    <div class="logo">

      <span *ngIf="!collapsed">
        <i class="fa-solid fa-robot"></i> دستیار هوش مصنوعی
      </span>

      <span *ngIf="collapsed">
        <i class="fa-solid fa-robot"></i>
      </span>

    </div>

    <button class="new-chat-btn" (click)="create()">
      <span *ngIf="collapsed"><i class="fa-solid fa-plus"></i></span>
      <span *ngIf="!collapsed"><i class="fa-solid fa-plus"></i> گفتگوی جدید</span>
    </button>

  </div>


  <div class="conversation-list">

    <div class="conversation-item" [class.active]="c.id === selectedId" [class.editing]="editingId===c.id"
      *ngFor="let c of conversations();trackBy:trackConversation" (click)="open(c.id)">

      <span class="icon"><i class="fa-regular fa-comments"></i></span>

      <input *ngIf="editingId === c.id" class="rename-input" [(ngModel)]="editingTitle"
        (click)="$event.stopPropagation()" (keydown.enter)="saveRename(c)" (keydown.escape)="cancelRename()">

      <span *ngIf="editingId !== c.id && !collapsed" class="title">
        {{ c.title }}
      </span>

      <div class="actions">

        <ng-container *ngIf="editingId===c.id">

          <button class="ok-btn" (click)="$event.stopPropagation();saveRename(c);">
            <i class="fa-solid fa-check"></i>
          </button>

          <button class="cancel-btn" (click)="cancelRename();$event.stopPropagation()">
            <i class="fa-solid fa-xmark"></i>
          </button>

        </ng-container>

        <ng-container *ngIf="editingId!==c.id">

          <button (click)="rename(c,$event)" title="تغییر نام">
            <i class="fa-solid fa-pen"></i>
          </button>

          <button (click)="showDelete(c);$event.stopPropagation()" title="حذف">
            <i class="fa-solid fa-trash"></i>
          </button>

        </ng-container>

      </div>
      <div class="delete-popup" *ngIf="confirmDeleteId===c.id" (click)="$event.stopPropagation()">
        <div>حذف گفتگو؟</div>

        <div class="popup-buttons">
          <button class="cancel" (click)="confirmDeleteId=''; $event.stopPropagation()">
            لغو
          </button>
          <button class="delete" (click)="delete(c); $event.stopPropagation()">
            حذف
          </button>
        </div>

      </div>
    </div>

  </div>

  <div class="sidebar-footer">
    <!-- باکس خوش‌آمدگویی و اطلاعات کاربر -->
    <div class="user-profile-box" *ngIf="!collapsed">
      <div class="avatar-circle">
        {{ userName ? userName.substring(0, 2).toUpperCase() : 'US' }}
      </div>
      <div class="user-details">
        <span class="welcome-text">خوش آمدید،</span>
        <span class="user-display-name">{{ userName }}</span>
      </div>
    </div>

    <div class="user-profile-box collapsed-profile" *ngIf="collapsed" title="{{ userName }}">
      <div class="avatar-circle">
        {{ userName ? userName.substring(0, 2).toUpperCase() : 'US' }}
      </div>
    </div>

    <!-- دکمه خروج -->
    <button class="logout-btn" (click)="logout()">
      <span class="logout-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
      <span *ngIf="!collapsed">خروج از حساب</span>
    </button>
  </div>
</div>
