<div class="chat-container">

  <div class="messages" #scrollContainer (scroll)="onMessagesScroll()">

    <div *ngFor="let m of messages()" class="msg" [class.user]="m.role === 'user'" [class.ai]="m.role === 'assistant'">

      <div class="msg-avatar">
        {{ m.role === 'user' ? 'شما' : 'AI' }}
      </div>

      <div class="msg-body">

        <div class="message-meta" *ngIf="m.model">
          {{ m.model }}
        </div>

        <!-- متن پیام -->
        <div class="message-content" [innerHTML]="render(m.content)"></div>

        <!-- دکمه کپی پیام -->
        <button 
          class="copy-btn" 
          (click)="copyToClipboard(m)" 
          [title]="m.copied ? 'کپی شد!' : 'کپی متن'" 
          [attr.aria-label]="m.copied ? 'کپی شد' : 'کپی متن پیام'">
          
          <!-- نمایش آیکون مناسب بر اساس وضعیت کپی -->
          <ng-container *ngIf="m.copied; else defaultCopyIcon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check2 text-success" viewBox="0 0 16 16">
              <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
            </svg>
          </ng-container>
          <ng-template #defaultCopyIcon>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
              <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
              <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
            </svg>
          </ng-template>
        </button>
      </div>

    </div>

  </div>

  <!-- دکمه اسکرول به پایین -->
  <button *ngIf="!shouldAutoScroll" class="scroll-bottom-button" type="button" (click)="enableAutoScrollAndGoBottom()">
    رفتن به آخر گفتگو
  </button>

  <!-- وضعیت فکر کردن مدل -->
  <div class="typing" *ngIf="isThinking()">
    هوش مصنوعی در حال فکر کردن است...
  </div>

  <!-- بخش ورودی پیام -->
  <div class="input-area">
    <div class="composer">

     <select
        class="model-select"
        [(ngModel)]="selectedModel"
        [disabled]="isSending() || modelsLoading() || models().length === 0"
        aria-label="انتخاب مدل">
        
        <option *ngIf="modelsLoading()" disabled value="">
          در حال دریافت مدل‌ها...
        </option>
        
        <option *ngIf="!modelsLoading() && models().length === 0" disabled value="">
          مدلی یافت نشد
        </option>

        <option *ngFor="let model of models()" [value]="model.id">
          {{ model.label }}
        </option>
      </select>


      <textarea 
        #messageInput 
        class="message-input" 
        [(ngModel)]="input" 
        rows="1" 
        aria-label="متن پیام ورودی"
        [placeholder]="isSending() ? 'منتظر پایان پاسخ بمانید...' : 'پیام خود را بنویسید...'"
        (input)="autoResizeTextarea(messageInput)" 
        (keydown)="handleEnter($event)">
      </textarea>

      <!-- دکمه ارسال پیام -->
      <button 
        *ngIf="!isSending()" 
        class="send-button" 
        type="button" 
        [disabled]="!input.trim()"
        (click)="send(messageInput)">
        ➤
      </button>

      <!-- دکمه لغو / توقف تولید پاسخ -->
      <button 
        *ngIf="isSending()" 
        class="stop-button" 
        type="button" 
        (click)="cancel()" 
        title="توقف تولید پاسخ">
        ■
      </button>
    </div>
  </div>

</div>
